# configurazione di Codeception per i test del framework
#
# i test non si eseguono da qui ma con _src/_sh/_codeception.run.sh, che raccoglie i test dello standard,
# dei moduli attivi e del custom in var/test/tests/ e li fa girare col framework gia' avviato da
# _usr/_test/_bootstrap.php; per approfondire vedi _usr/_docs/_read/180.test.md
paths:
  tests: ../../var/test/tests
  output: ../../var/test/output
  data: _tests/_data
  support: ../../var/test/support
  envs: _tests/_envs
actor_suffix: Tester
params:
  - env
extensions:
  enabled:
    - Codeception\Extension\RunFailed
