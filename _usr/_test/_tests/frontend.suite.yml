# suite frontend
#
# test del front-end: il sito come lo vede il visitatore ( form, carrello, checkout );
# girano in Chromium headless via chromedriver, perche' tendine intelligenti e form hanno bisogno di JavaScript

actor: FrontendTester
modules:
    enabled:
        - \Helper\Glisweb:
            gruppi: []
        - WebDriver:
            url: '%GLISWEB_TEST_URL%'
            browser: chrome
            port: '%GLISWEB_CHROMEDRIVER_PORT%'
            path: ''
            window_size: 1366x900
            # --ignore-certificate-errors: i deploy DEV/TEST con un host locale ( /etc/hosts ) hanno il certificato autofirmato
            # della macchina, e senza Chromium mostra una pagina vuota; non tocca la produzione, dove _bootstrap.php non fa partire i test
            capabilities:
                goog:chromeOptions:
                    args: [ '--headless', '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage', '--ignore-certificate-errors', '--user-agent=%GLISWEB_TEST_USER_AGENT%' ]
        - Asserts
    step_decorators: ~
