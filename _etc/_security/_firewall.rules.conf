#
# regole del firewall applicativo ( _src/_inc/_macro/_security.php )
#
# stato  zona  tipo  peso  valore
#
# stato: on attiva, obs in osservazione ( registra e basta ), off spenta
# zona:  path, query, uri, body, ua, valore
# tipo:  str sottostringa, word parola intera, re espressione regolare PHP, eq uguaglianza stretta
# peso:  punti dati all'IP; a 10 l'IP viene bandito
#
# ogni regola nuova nasce obs, e passa a on dopo qualche giorno di giornale pulito ( var/spool/security/eventi/ );
# prima di promuovere una modifica si lancia _src/_sh/_security.test.sh
#
# le regole del deploy vanno in etc/security/firewall.rules.conf: stessa zona, tipo e valore sostituiscono la regola
# standard, e con lo stato off la spengono
#

# attraversamento di cartelle
on   uri    str   10  ../..
on   uri    str   10  ..%2f

# file nascosti con credenziali e configurazioni
obs  path   re    10  /\/\.(env|git\/|svn\/|aws\/|ssh\/|htpasswd|DS_Store)/i

# Log4Shell, Struts, FortiGate
on   uri    str   10  ${jndi:
on   uri    str   10  redirectAction:
on   uri    str   10  java.lang.
on   uri    str   10  fgt_lang

# SQL injection e XSS nella querystring: bloccano la richiesta, ma possono essere una ricerca, quindi da sole non bandiscono
on   query  str   5   union all select
on   query  str   5   union select
on   query  str   5   <script
obs  query  re    5   /\b(sleep|benchmark|pg_sleep)\s*\(\s*\d/i
obs  query  re    5   /'\s*(or|and)\s+'?\d+'?\s*=\s*'?\d/i
obs  query  re    5   /\bon(error|load)\s*=/i

# le stesse firme nel corpo delle richieste
obs  body   str   10  ${jndi:
obs  body   str   10  <?php
obs  body   str   10  php://
obs  body   str   5   /etc/passwd
obs  body   str   5   union select

# strumenti di scansione che si dichiarano
obs  ua     str   10  sqlmap
obs  ua     str   10  nikto
obs  ua     str   10  nuclei
obs  ua     str   10  wpscan
obs  ua     str   10  zgrab
obs  ua     str   10  masscan
obs  ua     str   10  gobuster
obs  ua     str   10  dirbuster
obs  ua     str   10  feroxbuster
obs  ua     str   10  ${jndi:
