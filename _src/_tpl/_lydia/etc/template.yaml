template:
  type: "twig"
  menu:
    categorie: null
    sottomenu: null
    mega: null
    icons: null
    main: null
  default: "default.twig"
  login: "login.twig"

css:
  internal:
    all:
      - "_src/_css/_main.css"
  template:
    all:
      - "css/main.css"
  external:
    all:
      - "https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
      - "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      - "https://cdnjs.cloudflare.com/ajax/libs/jquery.colorbox/1.4.33/example1/colorbox.min.css"

js:
  external:
    - "https://code.jquery.com/jquery-3.5.1.min.js"
    - "https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"
    - "https://cdnjs.cloudflare.com/ajax/libs/jquery.colorbox/1.4.33/jquery.colorbox-min.js"
    - "https://cdnjs.cloudflare.com/ajax/libs/lazysizes/5.2.0/lazysizes.min.js"
    - "https://www.google.com/recaptcha/api.js"
  internal:
    - "_src/_js/_lib/_form.js"
    - "_src/_js/_main.js"
  template:
    - "js/main.js"
